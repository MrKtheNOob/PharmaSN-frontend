<header class="app-header">
  <div class="nav-container">
    <div class="brand" routerLink="/search">
      <span class="logo">💊</span> PharmaSN
    </div>
    <nav class="nav-links">
      <a routerLink="/search" routerLinkActive="active">Recherche</a>

      @if (!authService.isAuthenticated()) {
        <a routerLink="/login" routerLinkActive="active" class="btn-login">Connexion</a>
        <a routerLink="/register" class="btn-register">S'inscrire</a>
      } @else {
        <a routerLink="/dashboard" routerLinkActive="active">Mon Stock</a>
        <a routerLink="/profile" routerLinkActive="active">Mon Officine</a>
        <button (click)="onLogout()" class="btn-logout">Déconnexion</button>
      }
    </nav>
  </div>
</header>

<main class="content-area">
  <router-outlet />
</main>
