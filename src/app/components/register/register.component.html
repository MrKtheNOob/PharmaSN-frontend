<div class="auth-page">
  <div class="card auth-card">
    <div class="auth-header">
      <h2>Créer un compte</h2>
      <p>Rejoignez PharmaFinder pour gérer votre officine.</p>
    </div>

    <form (submit)="onRegister()">
      <div class="form-row">
        <div class="form-group">
          <label>Prénom</label>
          <input type="text" [(ngModel)]="prenom" name="prenom" class="form-control" placeholder="Jean" required>
        </div>
        <div class="form-group">
          <label>Nom</label>
          <input type="text" [(ngModel)]="nom" name="nom" class="form-control" placeholder="Dupont" required>
        </div>
      </div>

      <div class="form-group">
        <label>Adresse Email</label>
        <input type="email" [(ngModel)]="email" name="email" class="form-control" placeholder="jean.dupont@exemple.com" required>
      </div>

      <div class="form-group">
        <label>Mot de passe</label>
        <input type="password" [(ngModel)]="password" name="password" class="form-control" placeholder="Min. 6 caractères" required>
      </div>

      <div class="form-group">
        <label>Numéro de Licence</label>
        <input type="number" [(ngModel)]="numeroLicence" name="numeroLicence" class="form-control" placeholder="123456789" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block">S'inscrire</button>

      @if (error()) {
        <div class="alert error-alert">
          {{ error() }}
        </div>
      }
    </form>

    <div class="auth-footer">
      Déjà inscrit ? <a routerLink="/login">Connectez-vous</a>
    </div>
  </div>
</div>
