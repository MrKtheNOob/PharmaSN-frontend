<div class="auth-page">
  <div class="card auth-card">
    <div class="auth-header">
      <h2>Bon retour !</h2>
      <p>Connectez-vous pour gérer votre inventaire.</p>
    </div>

    <form (submit)="onLogin()">
      <div class="form-group">
        <label>Adresse Email</label>
        <input type="email" [(ngModel)]="email" name="email" class="form-control" placeholder="nom@exemple.com" required>
      </div>

      <div class="form-group">
        <label>Mot de passe</label>
        <input type="password" [(ngModel)]="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Se connecter</button>

      @if (error()) {
        <div class="alert error-alert">
          {{ error() }}
        </div>
      }
    </form>

    <div class="auth-footer">
      Pas encore de compte ? <a routerLink="/register">Inscrivez-vous</a>
    </div>
  </div>
</div>
